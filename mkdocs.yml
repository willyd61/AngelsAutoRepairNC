---
site_name: Angels Auto Repair
site_description: Carolina Beach shop site, brand kit, and GoC operating docs.
site_url: https://willyd61.github.io/AngelsAutoRepairNC/
repo_url: https://github.com/willyd61/AngelsAutoRepairNC
repo_name: willyd61/AngelsAutoRepairNC
theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
extra_css:
  - stylesheets/brand.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Home: index.md
  - Shop:
      - Brand: brand.md
      - Website: website.md
      - Print kit: print-kit.md
      - Agent handoff: agent-handoff.md
      - Final logo: decisions/0001-final-logo.md
  - Kickoff:
      - Checklist: kickoff-checklist.md
      - Project Intake: project-intake.md
      - Ownership: ownership.md
  - Standards:
      - Repository Standards: standards.md
      - Documentation Standards: docs-standards.md
      - Security Baseline: security-baseline.md
      - CI/CD Baseline: ci-cd-baseline.md
      - Release Governance: release-governance.md
      - Operations Baseline: operations-baseline.md
  - Playbooks:
      - General Triaging Chaos: triaging-chaos.md
      - Pages and Docs: pages-docs.md
      - Template Maintenance: template-maintenance.md
  - Examples: examples.md
